services:
  fix-traefik:
    image: traefik:v3.7
    container_name: fix-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fix

  fix-mongodb:
    image: mongo:7
    container_name: fix-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - fix-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fix

  fix-rabbitmq:
    image: rabbitmq:4-management
    container_name: fix-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - fix-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fix
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fix-ingress:
    build:
      context: ./fix-backend
      dockerfile: services/fix-ingress/Dockerfile
    environment:
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@fix-rabbitmq:5672/
    depends_on:
      fix-rabbitmq:
        condition: service_healthy
    networks:
      - fix
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fix-ingress.rule=PathPrefix(`/fix`)"
      - "traefik.http.routers.fix-ingress.entrypoints=web"
      - "traefik.http.services.fix-ingress.loadbalancer.server.port=8080"

  fix-consumer:
    build:
      context: ./fix-backend
      dockerfile: services/fix-consumer/Dockerfile
    environment:
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@fix-rabbitmq:5672/
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@fix-mongodb:27017/?authSource=admin
    depends_on:
      fix-rabbitmq:
        condition: service_healthy
      fix-mongodb:
        condition: service_healthy
    networks:
      - fix

volumes:
  fix-mongodb-data:
  fix-rabbitmq-data:

networks:
  fix:
    driver: bridge