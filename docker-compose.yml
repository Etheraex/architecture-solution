services:
  fix-traefik:
    image: traefik:v3.7
    container_name: fix-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fix

  auth-service:
    build:
      context: ./auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - fix
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-token.rule=PathPrefix(`/token`)"
      - "traefik.http.routers.auth-token.entrypoints=web"
      - "traefik.http.routers.auth-token.service=auth-service"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.jwt-auth.forwardauth.address=http://auth-service:8080/verify"
      - "traefik.http.middlewares.jwt-auth.forwardauth.authResponseHeaders=X-Auth-Subject,X-Auth-Roles"

  fix-mongodb:
    image: mongo:7
    container_name: fix-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-example}
    volumes:
      - fix-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fix

  fix-rabbitmq:
    image: rabbitmq:4-management
    container_name: fix-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - fix-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fix
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fix-ingress:
    build:
      context: ./fix-backend
      dockerfile: services/fix-ingress/Dockerfile
    environment:
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@fix-rabbitmq:5672/
    depends_on:
      fix-rabbitmq:
        condition: service_healthy
    networks:
      - fix
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fix-ingress.rule=PathPrefix(`/fix`)"
      - "traefik.http.routers.fix-ingress.entrypoints=web"
      - "traefik.http.services.fix-ingress.loadbalancer.server.port=8080"
      - "traefik.http.routers.fix-ingress.middlewares=jwt-auth"

  fix-consumer:
    build:
      context: ./fix-backend
      dockerfile: services/fix-consumer/Dockerfile
    environment:
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@fix-rabbitmq:5672/
      MONGO_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@fix-mongodb:27017/?authSource=admin
    depends_on:
      fix-rabbitmq:
        condition: service_healthy
      fix-mongodb:
        condition: service_healthy
    networks:
      - fix

  fix-processor:
    build:
      context: ./backend
      dockerfile: FixProcessor/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
    networks:
      - internal

  orchestrator:
    build:
      context: ./backend
      dockerfile: Orchestrator/Dockerfile
    environment:
      RABBITMQ_URI: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@fix-rabbitmq:5672/
      FIXPROCESSOR_URL: http://fix-processor:8080
    depends_on:
      fix-rabbitmq:
        condition: service_healthy
      fix-processor:
        condition: service_started
    networks:
      - fix
      - internal

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - observability

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - observability

volumes:
  fix-mongodb-data:
  fix-rabbitmq-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  fix:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  observability:
    driver: bridge
